[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/flowermoon-supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :1 -screen 0 1600x1000x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:window-manager]
command=/usr/bin/openbox
priority=20
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5901 -localhost -passwd vscode -forever -shared -noxdamage -noxrecord -quiet
priority=30
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websocket]
command=/usr/bin/websockify 127.0.0.1:6080 127.0.0.1:5901
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:portal]
command=/opt/flowermoon-venv/bin/python -B web/portal/server.py
directory=/opt/flowermoon
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
