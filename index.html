<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowerMoon Tools</title>
<meta name="description" content="FlowerMoonCraft browser tools for production engineering.">
<link rel="icon" href="logo.png">
<style>
:root {
  --background: #FAFAFA; --surface: #FFFFFF; --raised: #F3F3F5; --hover: #F0EAF2;
  --border: #E2E2E7; --strong: #B9BBC3; --text: #1C1C1C; --secondary: #5F6269;
  --primary: #82478C; --primary-hover: #713B7B; --selection: #EEE3F1; --on-primary: #FFFFFF;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(87,64,95,.08);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #1C1C1C; --surface: #252527; --raised: #303033; --hover: #3B3040;
    --border: #3D3D42; --strong: #74747F; --text: #FAFAFA; --secondary: #C2BEC8;
    --primary: #D5A2DF; --primary-hover: #E2B7EB; --selection: #443149; --on-primary: #1C1C1C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--background); color: var(--text); font: 15px/1.5 var(--font); display: flex; flex-direction: column; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
header { background: var(--surface); border-bottom: 1px solid var(--border); }
.bar, main, footer { width: min(1080px, 100% - 32px); margin: 0 auto; }
.bar { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
.logo { display: inline-flex; padding: 3px; background: #fff; border-radius: 8px; }
.bar h1 { margin: 0; font-size: 18px; font-weight: 600; }
.bar h1 span { color: var(--strong); font-weight: 400; padding: 0 6px; }
main { flex: 1; padding: 36px 0 48px; }
.intro { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.intro h2 { margin: 0 0 4px; font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--secondary); }
.search { width: min(320px, 100%); min-height: 38px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
.search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 0; margin: 0; list-style: none; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  text-decoration: none; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--primary); transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
.card-top { display: flex; align-items: center; gap: 12px; }
.icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--selection); color: var(--primary); flex: none; }
.icon svg { width: 24px; height: 24px; }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--raised); color: var(--secondary); }
.card p { margin: 0; color: var(--secondary); flex: 1; }
.note { color: var(--secondary); font-size: 12.5px; padding-left: 10px; border-left: 2px solid var(--selection); }
.open { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 14px; }
.card:hover .open { background: var(--primary-hover); }
.empty { color: var(--secondary); padding: 24px 0; }
footer { padding: 16px 0 24px; color: var(--secondary); font-size: 13px; border-top: 1px solid var(--border); }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .intro h2 { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo"><img src="logo.png" alt="FlowerMoon logo" width="34" height="34"></span>
    <h1>FlowerMoon<span>/</span>Tools</h1>
  </div>
</header>
<main>
  <div class="intro">
    <div>
      <h2>Choose a tool</h2>
      <p>Browser tools for production engineering. Open in your browser, nothing to install.</p>
    </div>
    <input class="search" id="search" type="search" placeholder="Search tools" aria-label="Search tools">
  </div>
  <ul class="grid" id="tools" aria-live="polite"></ul>
  <p class="empty" id="empty" hidden>No tool matches your search.</p>
</main>
<footer>FlowerMoonCraft · results are engineering estimates; verify before ordering or production.</footer>

<script src="tools.js"></script>
<script>
(function () {
  'use strict';
  var ICONS = {
    cutter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 10h11M14 3v18M14 14h7"/></svg>',
    paint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="15" height="6" rx="1.5"/><path d="M18 6h2.5v5H11v3"/><rect x="9" y="14" width="4" height="7" rx="1"/></svg>',
    route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>',
    generic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>'
  };
  var tools = window.FLOWERMOON_TOOLS || [];
  var list = document.getElementById('tools');
  var empty = document.getElementById('empty');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function card(t) {
    var li = el('li');
    var a = el('a', 'card');
    a.href = t.path;
    var top = el('div', 'card-top');
    var icon = el('span', 'icon');
    icon.innerHTML = ICONS[t.icon] || ICONS.generic;  // fixed markup from ICONS only
    var head = el('div');
    head.appendChild(el('h3', '', t.name));
    var meta = el('div', 'meta');
    [t.category, t.language, t.version].forEach(function (v) { if (v) meta.appendChild(el('span', 'tag', v)); });
    head.appendChild(meta);
    top.appendChild(icon);
    top.appendChild(head);
    a.appendChild(top);
    a.appendChild(el('p', '', t.description));
    if (t.note) a.appendChild(el('small', 'note', t.note));
    a.appendChild(el('span', 'open', 'Open →'));
    li.appendChild(a);
    return li;
  }

  function render(query) {
    var q = (query || '').trim().toLowerCase();
    var shown = tools.filter(function (t) {
      return !q || [t.name, t.category, t.description].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    list.replaceChildren.apply(list, shown.map(card));
    empty.hidden = shown.length > 0;
  }

  var search = document.getElementById('search');
  search.hidden = tools.length < 5;  // only useful once the list grows
  search.addEventListener('input', function () { render(search.value); });
  render('');
})();
</script>
</body>
</html>
