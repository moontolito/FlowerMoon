[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "debbie"
version = "0.1.0"
description = "Domain and geometry foundation for Debbie vNext"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["openpyxl>=3.1.5,<4", "PySide6>=6.10,<6.12"]

[project.scripts]
debbie-desktop = "debbie.desktop.app:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
