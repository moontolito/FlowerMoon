name: Transport tests
on:
  push:
    paths: ['apps/**', 'web/**', 'tests/**', '.devcontainer/**', 'scripts/**', '.github/workflows/transport-tests.yml']
  pull_request:
    paths: ['apps/**', 'web/**', 'tests/**', '.devcontainer/**', 'scripts/**', '.github/workflows/transport-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/transport
    steps:
      - uses: actions/checkout@v4
      - name: Install the same system Python and Tk packages as Codespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r ../../web/portal/requirements.txt
      - name: Unit tests
        run: |
          .venv/bin/python ../../scripts/prepare_transport_assets.py
          .venv/bin/python -B tests/run_checks.py
          .venv/bin/python -B -m unittest discover -s ../../web/portal/tests -v
      - name: Desktop interaction checks
        run: |
          FLOWERMOON_UI_ARTIFACTS="$GITHUB_WORKSPACE/.artifacts" xvfb-run -a -s '-screen 0 1600x1000x24' .venv/bin/python -B tests/run_checks.py --ui
      - name: Save destination interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowermoon-interface-verification
          path: .artifacts/site-environment-english.png
          if-no-files-found: error
          retention-days: 7
  source-connectivity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record live public-source availability
        run: python3 scripts/check_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: flowermoon-source-connectivity
          path: .artifacts/source-connectivity.json
          if-no-files-found: error
          retention-days: 7
  container-smoke:
    runs-on: ubuntu-24.04
    needs: linux-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start the actual Codespaces desktop container
        run: |
          mkdir -p .artifacts
          npx --yes @devcontainers/cli up --workspace-folder . > .artifacts/container-up.json
      - name: Check repeated lifecycle hooks keep the existing session
        run: |
          npx --yes @devcontainers/cli exec --workspace-folder . bash .devcontainer/start.sh
          npx --yes @devcontainers/cli exec --workspace-folder . bash .devcontainer/start.sh
      - name: Verify browser desktop and automatic app startup
        run: npx --yes @devcontainers/cli exec --workspace-folder . /opt/flowermoon-venv/bin/python scripts/check_desktop.py
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test the real browser connection, refresh and recovery
        working-directory: tests/browser
        run: |
          container_id=$(python3 -c "import json; print(json.load(open('../../.artifacts/container-up.json'))['containerId'])")
          container_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container_id")
          FLOWERMOON_TEST_URL="http://$container_ip:8000" npm test
      - name: Save desktop rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowermoon-browser-verification
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
