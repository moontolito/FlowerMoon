name: Public Render input diagnostic
on:
  push:
    branches: ['hosting/render']
    paths: ['tests/browser/input.spec.js', '.github/workflows/render-input-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check real sidebar clicks on the public deployment
        working-directory: tests/browser
        env:
          FLOWERMOON_TEST_URL: https://flowermoon.onrender.com
        run: npx playwright test input.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-input-diagnostic
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
